<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商财务数据分析智能体 2.0</title><style>body{margin:0;background:#f4f8f6;color:#123;font:16px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:60px auto;padding:24px}.card{background:#fff;border:1px solid #d9e8e1;border-radius:18px;padding:28px;box-shadow:0 8px 28px #0b765218}h1{margin-top:0;color:#087b64}input{width:calc(100% - 130px);padding:14px;border:1px solid #b9d5ca;border-radius:10px;font-size:16px}button{padding:14px 22px;margin-left:8px;border:0;border-radius:10px;background:#087f68;color:#fff;font-weight:700}#answer{margin-top:22px;padding:16px;background:#f2faf6;border-radius:10px;min-height:70px;color:#456}</style></head>
<body><main class="wrap"><section class="card"><h1>电商财务数据分析智能体 2.0</h1><p>用自然语言分析销售额、利润、部门和产品数据。</p><div><input id="q" placeholder="例如：昨天哪个部门利润最低？"><button onclick="ask()">开始分析</button></div><div id="answer">等待你的问题</div></section></main><script>async function ask(){const q=document.getElementById('q').value.trim();if(!q)return;const box=document.getElementById('answer');box.textContent='正在理解问题…';const r=await fetch('http://127.0.0.1:18781/api/agent/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();box.textContent=d.message||d.error||'暂无结果'}</script></body></html>
